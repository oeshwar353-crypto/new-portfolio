<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#070707"/>
  
  <!-- Subtle Grid Texture -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070707" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="950" cy="250" r="450" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>

  <!-- Logo Mark -->
  <g transform="translate(90, 90)">
    <rect width="48" height="48" rx="10" fill="#0D0D0D" stroke="#262626"/>
    <text x="24" y="33" text-anchor="middle" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold">O</text>
    <text x="64" y="33" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="1">OMY<tspan fill="#00E5FF">.</tspan></text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(90, 180)">
    <rect width="210" height="34" rx="17" fill="rgba(0, 229, 255, 0.08)" stroke="rgba(0, 229, 255, 0.3)"/>
    <circle cx="20" cy="17" r="4" fill="#00E5FF"/>
    <text x="35" y="22" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1">AI &amp; BACKEND DEVELOPER</text>
  </g>

  <!-- Big Typography -->
  <text x="90" y="290" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Om Eshwar Achary
  </text>

  <text x="90" y="360" fill="#909090" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="400">
    Building intelligent systems that matter.
  </text>

  <!-- Key Metrics / Tags -->
  <g transform="translate(90, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="46" rx="8" fill="#0D0D0D" stroke="#222"/>
    <text x="80" y="28" text-anchor="middle" fill="#EDEDED" font-family="'JetBrains Mono', monospace" font-size="14">FastAPI &bull; Python</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="180" height="46" rx="8" fill="#0D0D0D" stroke="#222"/>
    <text x="270" y="28" text-anchor="middle" fill="#EDEDED" font-family="'JetBrains Mono', monospace" font-size="14">LLMs &bull; Computer Vision</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="160" height="46" rx="8" fill="#0D0D0D" stroke="#222"/>
    <text x="460" y="28" text-anchor="middle" fill="#EDEDED" font-family="'JetBrains Mono', monospace" font-size="14">Next.js &bull; Supabase</text>

    <!-- Pill 4 (Highlight) -->
    <rect x="560" y="0" width="180" height="46" rx="8" fill="rgba(0, 229, 255, 0.05)" stroke="rgba(0, 229, 255, 0.3)"/>
    <text x="650" y="28" text-anchor="middle" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="14">Building BRIZ</text>
  </g>

  <!-- Location & Context -->
  <text x="1110" y="550" text-anchor="end" fill="#5E5E5E" font-family="'JetBrains Mono', monospace" font-size="14">
    Jaipur, Rajasthan, India &bull; NIAT
  </text>
</svg>
